[window]
padding = { x = 20, y = 20 }
dynamic_padding = true
decorations = "none"

opacity = 1.0
blur = false

[scrolling]
history = 10000
multiplier = 3

[font]
size = 9.0

[font.normal]
family = "monospace"
style = "Regular"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "Always" }
